[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# hashed build files never change: cache them for a year
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# the old Netlify address sends everyone to the real domain (permanent redirect, also for deep links)
[[redirects]]
  from = "https://commitai.netlify.app/*"
  to = "https://commitai.dev/:splat"
  status = 301
  force = true
